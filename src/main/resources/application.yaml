spring:
  application:
    name: ifs25003-pbo2026-springboot-cashflow
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:8080}
  # Aplikasi berjalan di belakang reverse proxy HTTPS saat deploy.
  forward-headers-strategy: framework
  # Kompresi teks (HTML/JS/CSS/JSON) untuk skor Lighthouse Performance.
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
